name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    # Ubuntu 24.04 remains the supported GitHub runner for the Python 3.9
    # compatibility leg; ubuntu-latest moved to 26.04 where 3.9 is unavailable.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q battery tests
      - run: bash -n battery/*.sh
